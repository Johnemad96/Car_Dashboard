# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "car-dashboard"
BBFILE_PATTERN_car-dashboard = "^${LAYERDIR}/"
BBFILE_PRIORITY_car-dashboard = "6"

LAYERDEPENDS_car-dashboard = "core"
LAYERSERIES_COMPAT_car-dashboard = "walnascar"
